ного покрытия.</li><li>▪️ Стулья, лавки и скамьи в едином стиле.</li></ul><h3>🌳 МАТЕРИАЛЫ</h3><p>Работаем с натуральной древесиной: дуб, карагач (вяз), ясень и другие породы дерева.</p><h3>🎨 СОТРУДНИЧАЕМ С ДИЗАЙНЕРАМИ И АРХИТЕКТОРАМИ</h3><p>Наша мастерская открыта к сотрудничеству с дизайнерами интерьеров, архитекторами и дизайн-студиями!</p><p>📸 Пришлите фотографию понравившейся мебели, эскиз или дизайн-проект.</p><p>📐 Укажите желаемые размеры — обсудим материалы, особенности конструкции и рассчитаем стоимость изготовления.</p><p><strong>💬 Напишите нам — поможем подобрать стол из натурального массива для вашего интерьера!</strong></p>]]></description>
